<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080a0d">
  <title>ページが見つかりません｜ストリートハウス湾岸通り</title>
  <link rel="stylesheet" href="site.css">
  <script src="config.js"></script>
  <style>
    .not-found-main{min-height:100vh;background:#080a0d;color:#fff;display:grid;place-items:center;padding:40px 20px}
    .not-found-card{width:min(760px,100%);border:1px solid #2b3139;background:#10151b;padding:52px;border-radius:4px}
    .not-found-card b{color:#f2c515;letter-spacing:.14em;font-size:12px}
    .not-found-card h1{font-size:clamp(34px,7vw,72px);margin:18px 0 14px;line-height:1.05}
    .not-found-card p{color:#c4c9d0;line-height:1.9}
    .not-found-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
    @media(max-width:600px){.not-found-card{padding:34px 24px}}
  </style>
</head>
<body class="business-site" data-page="404">
<main class="not-found-main">
  <section class="not-found-card">
    <b>404 / PAGE NOT FOUND</b>
    <h1>ページが見つかりません。</h1>
    <p>URLが変更されたか、ページが削除された可能性があります。トップページまたはWEB受付からお進みください。</p>
    <div class="not-found-actions">
      <a class="btn btn-primary" href="index.html">トップページへ</a>
      <a class="btn btn-outline" href="contact.html">WEB受付へ</a>
    </div>
  </section>
</main>
<script src="site.js"></script>
</body>
</html>
